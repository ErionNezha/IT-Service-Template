*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0e14;color:#e6e6e6;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}
header.top{background:linear-gradient(135deg,#0d1b2a,#1b263b);padding:28px 20px;text-align:center;border-bottom:2px solid #00d4ff33}
header.top h1{font-size:1.7rem;color:#fff;margin-bottom:8px}
header.top p{color:#9fb3c8;max-width:760px;margin:0 auto 12px;line-height:1.55;font-size:.95rem}
.badges{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.badge{background:#00d4ff22;border:1px solid #00d4ff66;color:#7fdbff;padding:4px 12px;border-radius:20px;font-size:.78rem}
.tabs{display:flex;gap:10px;justify-content:center;padding:16px;background:#0d1420;border-bottom:1px solid #ffffff14}
.tabs button{background:#1b263b;color:#cfd8e3;border:1px solid #ffffff22;padding:10px 22px;border-radius:8px;cursor:pointer;font-size:.92rem;transition:.2s}
.tabs button.active,.tabs button:hover{background:#00d4ff;color:#04121a;border-color:#00d4ff;font-weight:600}
main{flex:1;padding:20px;max-width:1200px;width:100%;margin:0 auto}
.panel{display:none}
.panel.active{display:block}
iframe.demo{width:100%;height:78vh;border:1px solid #ffffff22;border-radius:10px;background:#fff}
.codewrap{display:flex;gap:0;border:1px solid #ffffff22;border-radius:10px;overflow:hidden;height:78vh;background:#0d1117}
.tree{width:250px;min-width:200px;background:#0d1420;border-right:1px solid #ffffff14;overflow-y:auto;padding:12px;font-size:.82rem}
.tree .tfile{padding:5px 8px;border-radius:5px;cursor:pointer;color:#9fb3c8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tree .tfile:hover{background:#ffffff10;color:#fff}
.tree .tfile.active{background:#00d4ff26;color:#7fdbff}
.tree .tdir{color:#5c6b7f;font-weight:600;margin-top:8px;font-size:.75rem;text-transform:uppercase;letter-spacing:.5px}
.codeview{flex:1;overflow:auto;padding:0;position:relative}
.codeview pre{padding:16px;font-family:'Consolas','Fira Code',monospace;font-size:.82rem;line-height:1.6;color:#d6deeb;white-space:pre}
.codeview .lineno{color:#4a5568;user-select:none;margin-right:12px;display:inline-block;width:32px;text-align:right}
.cbar{display:flex;gap:8px;align-items:center;padding:10px 14px;background:#0d1420;border-bottom:1px solid #ffffff14;font-size:.82rem;color:#9fb3c8;overflow-x:auto}
footer{text-align:center;padding:18px;color:#5c6b7f;font-size:.85rem;border-top:1px solid #ffffff10;margin-top:10px}
footer strong{color:#9fb3c8}
.note{background:#00d4ff12;border:1px solid #00d4ff44;border-radius:8px;padding:12px 16px;margin-bottom:16px;font-size:.86rem;color:#9fb3c8;line-height:1.6}
.kw{color:#ff7edb}.st{color:#ffd75c}.cm{color:#5c6b7f;font-style:italic}.fn{color:#7fdbff}.nm{color:#f78c6c}
@media(max-width:860px){.codewrap{flex-direction:column}.tree{width:100%;max-height:150px;border-right:none;border-bottom:1px solid #ffffff14}}

function show(id,btn){document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));document.getElementById('p-'+id).classList.add('active');document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');}
const BINRE=/\.(png|jpe?g|gif|svg|ico|exe|class|o|jar|dat|ogg|mp3|wav|ttf|woff2?|eot|pdf|zip|rar|db|sqlite)$/i;
function escAttr(s){return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}
function buildTree(){
  const t=document.getElementById('tree');let html='';
  const walk=(node,prefix)=>{node.dirs.forEach(d=>{html+='<div class="tdir">📁 '+escAttr(prefix+d.name)+'</div>';walk(d,prefix+d.name+'/');});node.files.forEach(f=>{html+='<div class="tfile" data-p="'+escAttr(prefix+f)+'">📄 '+escAttr(f)+'</div>';});};
  walk(TREE,'');t.innerHTML=html;
  t.querySelectorAll('.tfile').forEach(el=>el.onclick=()=>openFile(el.dataset.p,el));
  const first=t.querySelector('.tfile');if(first)openFile(first.dataset.p,first);
}
async function openFile(path,el){
  document.querySelectorAll('.tfile').forEach(e=>e.classList.remove('active'));el.classList.add('active');
  document.getElementById('cbar').textContent=path;
  const box=document.getElementById('codebox');
  if(BINRE.test(path)){box.innerHTML='<pre>📦 File binar — nuk shfaqet si tekst. (përmbajtja origjinale ruhet e paprekur)</pre>';return;}
  try{const r=await fetch(encodeURI(path));if(!r.ok)throw 0;const txt=await r.text();
    box.innerHTML='<pre>'+hl(txt)+'</pre>';
  }catch(e){box.innerHTML='<pre>Deshtoi leximi i file-it.</pre>';}
}
function hl(code){
  const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const tok=/(\/\/[^\n]*|\/\*[\s\S]*?\*\/|#[^\n]*|<!--[\s\S]*?-->)|("[^"\n]*"|'[^'\n]*')|\b(import|from|as|def|return|if|elif|else|for|while|in|not|and|or|class|try|except|finally|with|lambda|pass|break|continue|print|var|let|const|function|new|this|null|true|false|public|static|void|int|char|float|double|struct|include|=>)\b|\b(\d+(\.\d+)?)\b/g;
  let out='',last=0,m;
  while((m=tok.exec(code))!==null){
    out+=esc(code.slice(last,m.index));
    const cls=m[1]?'cm':m[2]?'st':m[3]?'kw':'nm';
    out+='<span class="'+cls+'">'+esc(m[0])+'</span>';
    last=m.index+m[0].length;
  }
  out+=esc(code.slice(last));
  return out.split('\n').map((l,i)=>'<span class="lineno">'+(i+1)+'</span>'+(l||' ')).join('\n');
}
